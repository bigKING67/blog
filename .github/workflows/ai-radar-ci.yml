name: AI Radar CI

on:
  pull_request:
    paths:
      - "src/content/ai-*/**"
      - "src/pages/ai/**"
      - "src/data/ai/**"
      - "src/content.config.ts"
      - "src/config/navBarConfig.ts"
      - "scripts/validate-ai-content.ts"
      - "docs/AI_RADAR.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ai-radar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AI Radar data
        run: pnpm validate:ai

      - name: Astro / TypeScript checks
        run: pnpm check

      - name: Production-equivalent Pages build
        run: pnpm build:pages
