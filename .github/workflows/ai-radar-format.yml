name: AI Radar Format (temporary)

on:
  pull_request:
    branches: [ master ]
    paths:
      - "src/pages/ai/**"
      - "src/content.config.ts"
      - "src/config/navBarConfig.ts"
      - "scripts/validate-ai-content.ts"
      - ".github/workflows/ai-radar-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format AI Radar source
        run: |
          pnpm exec biome check --write src/pages/ai src/content.config.ts src/config/navBarConfig.ts scripts/validate-ai-content.ts
          git diff --check

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ai src/content.config.ts src/config/navBarConfig.ts scripts/validate-ai-content.ts
          git commit -m "style(ai-radar): apply Biome formatting"
          git push
